<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .profile-card {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-info h2 { margin: 0; font-size: 14px; color: #ffffff; }
    .user-info p { margin: 2px 0 0 0; font-size: 11px; color: #3b82f6; }
    
    .status-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
    }
    .status-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
    }
    .status-available { background-color: rgba(16, 185, 129, 0.1); color: #34d399; }
    .status-busy { background-color: rgba(245, 158, 11, 0.1); color: #fbbf24; }

    .input-field {
      width: 100%;
      background-color: #0b0f19;
      border: 1px solid #374151;
      color: #ffffff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 8px;
      box-sizing: border-box;
    }
    .btn-primary {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-toggle {
      background-color: #1f2937;
      color: #cbd5e1;
      border: 1px solid #374151;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .task-desc {
      font-size: 12px;
      color: #e2e8f0;
      background-color: #0b0f19;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #1f2937;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- VISTA 1: INGRESO AL SISTEMA (Oculta tras login) -->
  <div id="loginView" class="card">
    <h2 style="font-size: 14px; margin-top: 0; color: #ffffff; text-align: center;">Ingreso al Sistema</h2>
    <input type="text" id="inputUsername" class="input-field" placeholder="Usuario o Correo">
    <input type="password" id="inputPassword" class="input-field" placeholder="Contraseña">
    <button id="btnLogin" class="btn-primary">Conectar</button>
  </div>

  <!-- VISTA 2: PANEL DE TRABAJADOR (Oculta antes del login) -->
  <div id="dashboardView" style="display: none;">
    <div class="card profile-card">
      <div style="font-size: 24px;">👨‍🔧</div>
      <div class="user-info">
        <h2 id="userName">Luis Martínez</h2>
        <p id="userRole">QA Tester</p>
      </div>
    </div>

    <div class="card status-section">
      <div id="statusBadge" class="status-badge status-available">Disponible</div>
      <button id="btnToggle" class="btn-toggle">Ponerme Ocupado</button>
    </div>

    <div class="card">
      <div id="taskText" class="task-desc">No tienes actividades asignadas por el momento. Tu estado figura como libre.</div>
      <button id="btnAction" class="btn-primary" style="display: none;">🚀 Solicitar Revisión</button>
    </div>

    <button id="btnLogout" style="background:none; border:none; color:#ef4444; font-size:10px; cursor:pointer; width:100%;">Cerrar Sesión</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
