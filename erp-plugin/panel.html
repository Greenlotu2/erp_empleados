<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROCAL ERP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px;
      user-select: none;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(30, 41, 59, 0.8);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      width: 26px;
      height: 26px;
      background-color: #2563eb;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .brand-title {
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
      color: #e2e8f0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background-color: #1e293b;
      color: #ffffff;
    }

    .icon-btn.logout:hover {
      background-color: rgba(127, 29, 29, 0.4);
      color: #f87171;
    }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Card de Usuario */
    .user-card {
      background-color: #0f172a;
      border: 1px solid rgba(30, 41, 59, 0.8);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-role-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10b981;
    }

    .user-role {
      font-size: 10px;
      color: #60a5fa;
      text-transform: capitalize;
    }

    /* Timer Widget */
    .timer-widget {
      background: linear-gradient(135deg, #0f172a 0%, rgba(30, 27, 75, 0.4) 100%);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .timer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .timer-badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 600;
      background-color: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .timer-clock {
      font-family: "Courier New", Courier, monospace;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      padding: 4px 0;
      letter-spacing: 2px;
    }

    .timer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #cbd5e1;
      margin-top: 4px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background-color: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #818cf8);
      border-radius: 999px;
      width: 0%;
      transition: width 0.5s ease;
    }

    /* Pestañas */
    .tabs-container {
      background-color: #0f172a;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid rgba(30, 41, 59, 0.8);
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 6px 0;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: #2563eb;
      color: #ffffff;
    }

    /* Sub-filtros */
    .subfilters-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 12px;
    }

    .subfilter-btn {
      padding: 5px 0;
      text-align: center;
      font-size: 10px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid #1e293b;
      background-color: #0b0f19;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }

    .subfilter-btn.active {
      background-color: #1e293b;
      color: #60a5fa;
      border-color: #3b82f6;
      font-weight: 600;
    }

    /* Content List */
    .content-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    /* Estilos para Tarjetas de Tareas y Reuniones */
    .card-item {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.3;
    }

    .card-badge {
      font-size: 9px;
      background-color: #1e1b4b;
      color: #818cf8;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .card-desc {
      font-size: 10px;
      color: #94a3b8;
      line-height: 1.4;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      padding-top: 6px;
      border-top: 1px solid rgba(30, 41, 59, 0.6);
    }

    .card-meta {
      font-size: 9px;
      color: #64748b;
    }

    .btn-action {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-action:hover {
      background-color: #1d4ed8;
    }

    /* Login Form */
    .login-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 0;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .form-input {
      width: 100%;
      padding: 8px 12px;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      font-size: 12px;
      color: #ffffff;
      outline: none;
    }

    .form-input:focus {
      border-color: #2563eb;
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <!-- Header Superior -->
  <header>
    <div class="brand">
      <div class="logo-badge">R</div>
      <span class="brand-title">ROCAL ERP</span>
    </div>
    
    <div class="header-actions">
      <button id="btn-popout" title="Abrir en ventana flotante" class="icon-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
      </button>
      <button id="btn-logout" title="Cerrar Sesión" style="display:none;" class="icon-btn logout">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </button>
    </div>
  </header>

  <!-- Contenedor Dinámico -->
  <main id="screen-container"></main>

  <script src="panel.js"></script>
</body>
</html>
