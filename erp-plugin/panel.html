<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROCAL ERP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 6px;
      user-select: none;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 6px;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(30, 41, 59, 0.8);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .logo-badge {
      width: 26px;
      height: 26px;
      background-color: #2563eb;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .brand-title {
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
      color: #e2e8f0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 3px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background-color: #1e293b;
      color: #ffffff;
    }

    .icon-btn.logout:hover {
      background-color: rgba(127, 29, 29, 0.4);
      color: #f87171;
    }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Card de Usuario */
    .user-card {
      background-color: #0f172a;
      border: 1px solid rgba(30, 41, 59, 0.8);
      border-radius: 12px;
      padding: 6px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-role-container {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 2px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10b981;
    }

    .user-role {
      font-size: 10px;
      color: #60a5fa;
      text-transform: capitalize;
    }

    /* Timer Widget */
    .timer-widget {
      background: linear-gradient(135deg, #0f172a 0%, rgba(30, 27, 75, 0.4) 100%);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
      padding: 6px;
      margin-bottom: 6px;
    }

    .timer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
      margin-bottom: 2px;
    }

    .timer-badge {
      padding: 2px 3px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 600;
      background-color: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .timer-clock {
      font-family: "Courier New", Courier, monospace;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      padding: 2px 0;
      letter-spacing: 2px;
    }

    .timer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #cbd5e1;
      margin-top: 2px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background-color: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 3px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #818cf8);
      border-radius: 999px;
      width: 0%;
      transition: width 0.5s ease;
    }

    /* Pestañas */
    .tabs-container {
      background-color: #0f172a;
      padding: 2px;
      border-radius: 10px;
      border: 1px solid rgba(30, 41, 59, 0.8);
      display: flex;
      gap: 2px;
      margin-bottom: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 3px 0;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: #2563eb;
      color: #ffffff;
    }

    /* Sub-filtros */
    .subfilters-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      margin-bottom: 6px;
    }

    .subfilter-btn {
      padding: 3px 0;
      text-align: center;
      font-size: 10px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid #1e293b;
      background-color: #0b0f19;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }

    .subfilter-btn.active {
      background-color: #1e293b;
      color: #60a5fa;
      border-color: #3b82f6;
      font-weight: 600;
    }

    /* Content List */
    .content-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    /* Estilos para Tarjetas de Tareas y Reuniones */
    .card-item {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 6px 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 4px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.3;
    }

    .card-badge {
      font-size: 9px;
      background-color: #1e1b4b;
      color: #818cf8;
      padding: 2px 3px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .card-desc {
      font-size: 10px;
      color: #94a3b8;
      line-height: 1.4;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
      padding-top: 3px;
      border-top: 1px solid rgba(30, 41, 59, 0.6);
    }

    .card-meta {
      font-size: 9px;
      color: #64748b;
    }

    .btn-action {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 2px 4px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-action:hover {
      background-color: #1d4ed8;
    }

    /* Login Form */
    .login-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6px 0;
    }

    .form-group {
      margin-bottom: 6px;
    }

    .form-label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .form-input {
      width: 100%;
      padding: 4px 6px;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      font-size: 12px;
      color: #ffffff;
      outline: none;
    }

    .form-input:focus {
      border-color: #2563eb;
    }

    .btn-submit {
      width: 100%;
      padding: 6px;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    /* ==========================================
   TARJETAS DE TAREAS Y REUNIONES (UI/UX)
   ========================================== */

/* Tarjeta contenedora */
.card-item {
  background-color: #0f172a;
  border: 1px solid #1e293b;
  border-radius: 10px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: border-color 0.2s ease, transform 0.1s ease;
}

.card-item:hover {
  border-color: #334155;
}

/* Cabecera de la tarjeta */
.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 4px;
}

.card-title {
  font-size: 12px;
  font-weight: 700;
  color: #f8fafc;
  line-height: 1.35;
  flex: 1;
}

/* Badges / Etiquetas */
.card-badge {
  font-size: 9px;
  font-weight: 600;
  padding: 2px 4px;
  border-radius: 6px;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 2px;
}

.badge-project {
  background-color: rgba(99, 102, 241, 0.15);
  color: #a5b4fc;
  border: 1px solid rgba(99, 102, 241, 0.3);
}

.badge-status-pending {
  background-color: rgba(245, 158, 11, 0.15);
  color: #fcd34d;
  border: 1px solid rgba(245, 158, 11, 0.3);
}

.badge-status-review {
  background-color: rgba(59, 130, 246, 0.15);
  color: #93c5fd;
  border: 1px solid rgba(59, 130, 246, 0.3);
}

.badge-status-completed {
  background-color: rgba(16, 185, 129, 0.15);
  color: #6ee7b7;
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.badge-status-overdue {
  background-color: rgba(239, 68, 68, 0.15);
  color: #fca5a5;
  border: 1px solid rgba(239, 68, 68, 0.3);
}

/* Botón del ojo dentro del campo de contraseña del login */
.ver-pass {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  color: #64748b;
  cursor: pointer;
}

.ver-pass:hover { color: #e2e8f0; }

.badge-status-fix {
  background-color: rgba(249, 115, 22, 0.15);
  color: #fdba74;
  border: 1px solid rgba(249, 115, 22, 0.35);
}

/* Tarea devuelta para corregir + comentario del revisor */
.card-item.card-fix {
  border-color: rgba(249, 115, 22, 0.55);
}

.review-comment {
  background-color: rgba(249, 115, 22, 0.08);
  border-left: 3px solid #f97316;
  border-radius: 6px;
  padding: 4px 6px;
}

.review-comment-title {
  font-size: 10px;
  font-weight: 700;
  color: #fdba74;
}

.review-comment-body {
  font-size: 11px;
  color: #e2e8f0;
  line-height: 1.45;
  margin-top: 2px;
  white-space: pre-wrap;
  word-break: break-word;
  user-select: text;
}

.review-comment-date {
  font-size: 9px;
  color: #94a3b8;
  margin-top: 2px;
}

/* Aviso de aprobación */
.review-approved {
  background-color: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.35);
  border-radius: 10px;
  padding: 5px 6px;
  margin-bottom: 6px;
  display: flex;
  gap: 5px;
}

.review-approved-icon { font-size: 12px; line-height: 1.3; }
.review-approved-text { flex: 1; min-width: 0; }

.review-approved-title {
  font-size: 11px;
  font-weight: 700;
  color: #6ee7b7;
}

.review-approved-body {
  font-size: 11px;
  color: #cbd5e1;
  line-height: 1.4;
  margin-top: 1px;
  word-break: break-word;
  user-select: text;
}

.review-approved-close {
  background: transparent;
  border: none;
  color: #64748b;
  font-size: 11px;
  cursor: pointer;
  align-self: flex-start;
}

.review-approved-close:hover { color: #e2e8f0; }

.badge-time {
  background-color: #1e293b;
  color: #cbd5e1;
  border: 1px solid #334155;
  font-family: monospace;
}

/* Cuerpo / Descripción */
.card-desc {
  font-size: 11px;
  color: #94a3b8;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Pie de tarjeta */
.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 2px;
  padding-top: 4px;
  border-top: 1px solid rgba(30, 41, 59, 0.7);
}

.card-meta {
  font-size: 9px;
  color: #64748b;
  display: flex;
  align-items: center;
  gap: 3px;
}

/* Botones de acción */
.btn-action {
  background-color: #2563eb;
  color: #ffffff;
  border: none;
  padding: 3px 6px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  transition: background-color 0.2s ease, transform 0.1s ease;
}

.btn-action:hover {
  background-color: #1d4ed8;
}

.btn-action:active {
  transform: scale(0.97);
}

.btn-meeting-link {
  background-color: #0284c7;
  color: #ffffff;
  border: none;
  padding: 3px 6px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 600;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  transition: background-color 0.2s ease;
}

.btn-meeting-link:hover {
  background-color: #0369a1;
}

/* Recompensas */
.rewards-badge {
  display: flex;
  align-items: center;
  gap: 2px;
  background-color: rgba(245, 158, 11, 0.12);
  border: 1px solid rgba(245, 158, 11, 0.3);
  color: #fcd34d;
  padding: 2px 4px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
}

/* Adjuntar evidencia */
.card-actions {
  display: flex;
  align-items: center;
  gap: 3px;
}

.btn-attach {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background-color: #1e293b;
  color: #94a3b8;
  cursor: pointer;
  font-size: 11px;
  flex-shrink: 0;
  transition: background-color 0.2s, color 0.2s;
}

.btn-attach:hover { background-color: #334155; color: #e2e8f0; }

.btn-attach.has-file {
  background-color: rgba(16, 185, 129, 0.15);
  color: #6ee7b7;
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.evidence-name {
  font-size: 9px;
  color: #94a3b8;
  max-width: 80px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Botón de actualizar */
@keyframes spin-refresh {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

#btn-refresh.spinning svg {
  animation: spin-refresh 0.6s linear;
}

/* Avisos (historial de notificaciones) */
.tab-contador { display: inline-block; min-width: 14px; padding: 0 4px; margin-left: 3px; border-radius: 7px; background: #dc2626; color: #fff; font-size: 9px; line-height: 14px; font-weight: 700; }
.avisos-acciones { display: flex; justify-content: flex-end; margin-bottom: 4px; }
.avisos-limpiar { background: transparent; border: none; color: #64748b; font-size: 10px; cursor: pointer; padding: 2px 4px; }
.avisos-limpiar:hover { color: #f87171; }
.aviso-nuevo { border-color: rgba(37, 99, 235, 0.6) !important; background-color: rgba(37, 99, 235, 0.08) !important; }
.aviso-punto { width: 7px; height: 7px; border-radius: 50%; background: #3b82f6; flex-shrink: 0; }

/* Llegada de avisos: banner, campana que se mueve y tarjetas que brillan */
.toast-aviso { position: fixed; top: 8px; left: 8px; right: 8px; z-index: 9999; display: flex; gap: 8px; align-items: flex-start; padding: 9px 10px 11px; border-radius: 10px; background: linear-gradient(135deg, #1e3a8a, #1d4ed8); border: 1px solid #60a5fa; box-shadow: 0 8px 24px rgba(37, 99, 235, 0.45); color: #fff; cursor: pointer; overflow: hidden; animation: toast-entra 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
.toast-aviso.saliendo { animation: toast-sale 0.25s ease-in forwards; }
.toast-campana { font-size: 18px; line-height: 1; animation: campana 0.9s ease-in-out 2; transform-origin: 50% 0; }
.toast-cuerpo { flex: 1; min-width: 0; }
.toast-etiqueta { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #bfdbfe; }
.toast-titulo { font-size: 12px; font-weight: 700; margin-top: 1px; }
.toast-mensaje { font-size: 11px; color: #dbeafe; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast-cerrar { background: transparent; border: none; color: #bfdbfe; font-size: 11px; cursor: pointer; padding: 0 2px; }
.toast-cerrar:hover { color: #fff; }
.toast-progreso { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: #93c5fd; transform-origin: left; animation: toast-progreso 8s linear forwards; }
.tab-btn.tiene-avisos:not(.active) { color: #fbbf24; }
.tab-btn.tiene-avisos .tab-campana { display: inline-block; animation: campana 0.9s ease-in-out infinite; animation-delay: 0.3s; transform-origin: 50% 0; }
.tab-btn.tiene-avisos .tab-contador { animation: pulso 1.6s ease-out infinite; }
.aviso-nuevo { border-left: 3px solid #3b82f6 !important; animation: brillo 1.8s ease-in-out 3; }
@keyframes toast-entra { from { transform: translateY(-120%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes toast-sale { to { transform: translateY(-120%); opacity: 0; } }
@keyframes toast-progreso { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes campana { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(14deg); } 30% { transform: rotate(-12deg); } 45% { transform: rotate(8deg); } 60% { transform: rotate(-6deg); } 75% { transform: rotate(3deg); } }
@keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); } 100% { box-shadow: 0 0 0 6px rgba(220, 38, 38, 0); } }
@keyframes brillo { 0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } 50% { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35); } }

/* Acciones junto al usuario: actualizar + menú ⋮ */
.user-acciones { display: flex; align-items: center; gap: 1px; margin-left: 2px; }
.menu-wrap { position: relative; }
.menu-opciones { position: absolute; top: calc(100% + 4px); right: 0; z-index: 50; min-width: 178px; padding: 4px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45); }
.menu-opciones[hidden] { display: none; }
.menu-item { display: flex; align-items: center; gap: 7px; width: 100%; padding: 6px 8px; border: none; border-radius: 6px; background: transparent; color: #cbd5e1; font-size: 11px; text-align: left; cursor: pointer; }
.menu-item:hover { background: #1e293b; color: #fff; }
.menu-item.peligro { color: #f87171; }
.menu-item.peligro:hover { background: rgba(127, 29, 29, 0.4); }
.menu-separador { height: 1px; margin: 3px 2px; background: #1e293b; }

.menu-check { width: 13px; height: 13px; flex-shrink: 0; border-radius: 3px; border: 1px solid #475569; display: inline-flex; align-items: center; justify-content: center; }
.menu-item.activo .menu-check { background: #2563eb; border-color: #2563eb; }
.menu-item.activo .menu-check::after { content: ''; width: 3px; height: 6px; border: solid #fff; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg) translate(-0.5px, -0.5px); }
  </style>
</head>
<body>


  <!-- Contenedor Dinámico -->
  <main id="screen-container"></main>

  <script src="panel.js"></script>
</body>
</html>
