<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ERP Empleados</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 14px; background-color: #0b0f19; color: #ffffff;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #1f2937; padding-bottom: 8px; margin-bottom: 12px;
    }
    .title { font-size: 11px; font-weight: 800; color: #9ca3af; letter-spacing: 0.5px; }
    .btn-action {
      cursor: pointer; color: #fff; font-size: 10px; font-weight: bold;
      border: none; padding: 4px 8px; border-radius: 4px;
    }
    .btn-popout { background-color: #3b82f6; }
    .btn-logout { background-color: #dc2626; display: none; }
    #screen-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">❖ ERP EMPLEADOS</span>
    <div style="display: flex; gap: 6px;">
      <button id="btn-popout" class="btn-action btn-popout" title="Abrir como ventana independiente">↗ Flotante</button>
      <button id="btn-logout" class="btn-action btn-logout">SALIR</button>
    </div>
  </div>

  <div id="screen-container"></div>

  <script src="panel.js"></script>
</body>
</html>
