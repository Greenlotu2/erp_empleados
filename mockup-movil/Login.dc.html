<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Geist, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #2563eb; } a:hover { color: #1d4ed8; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: linear-gradient(150deg, #e94f1b 0%, #21388e 100%); display: flex; flex-direction: column; justify-content: center; padding: 0 24px; box-sizing: border-box;">

  <!-- Marca -->
  <div style="text-align: center; margin-bottom: 28px;">
    <img src="logo_rocal_bl.png" alt="Rocal" style="width: 190px; height: auto; margin: 0 auto; display: block;">
    <div style="margin-top: 10px; font-size: 13px; font-weight: 500; color: #ffffff; letter-spacing: 0.02em; opacity: 0.92;">ERP Empresarial · Rocal S.A. de C.V.</div>
  </div>

  <!-- Tarjeta de acceso -->
  <div style="background: #ffffff; border-radius: 20px; padding: 24px 20px; box-shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.35);">

    <div style="font-size: 18px; font-weight: 600; color: #0f172a;">Iniciar sesión</div>
    <div style="font-size: 13px; color: #64748b; margin-top: 4px;">Consulta tus tareas y avisos desde el celular.</div>

    <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 22px;">

      <div>
        <label style="display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 7px;">Usuario o correo</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border: 1px solid #e2e8f0; border-radius: 12px; background: #ffffff; box-sizing: border-box;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="8" r="4" /><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" /></svg>
          <span style="font-size: 15px; color: #94a3b8;">usuario o tu@empresa.com</span>
        </div>
      </div>

      <div>
        <label style="display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 7px;">Contraseña</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border: 1px solid #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); border-radius: 12px; background: #ffffff; box-sizing: border-box;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="4" y="10" width="16" height="11" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg>
          <span style="flex-grow: 1; font-size: 17px; color: #1e293b; letter-spacing: 0.14em;">••••••••</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></svg>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 9px; min-height: 44px;">
        <span style="width: 20px; height: 20px; border-radius: 6px; background: #2563eb; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
        </span>
        <span style="font-size: 14px; color: #334155;">Mantener sesión iniciada</span>
      </div>

      <div style="height: 52px; border-radius: 12px; background: #2563eb; color: #ffffff; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Ingresar</div>

    </div>
  </div>

  <div style="text-align: center; margin-top: 20px; font-size: 12px; color: #ffffff; opacity: 0.8;">¿Olvidaste tu contraseña? Contacta a tu administrador.</div>

</div>
</x-dc>
</body>
</html>
